правочника \\"Номенклатура\\"","confirmed":true},{"id":"2.13","section_number":2,"section":"Планирование","question_number":13,"question":"Коэффициент, по которому происходит преобразование количества, указанного в документе \\"План продаж по категориям\\", в количество конкретной номенклатурной позиции:","options":"1) определяется в документе \\"Нормативы распределения планов продаж по категориям\\"\\n2) рассчитывается, исходя из коэффициента, указанного в документе \\"Нормативы распределения планов продаж по категориям\\", и скорости продаж\\n3) вариант 1 или 2 (в зависимости от настроек системы)\\n4) вариант 1 или 2 (в зависимости от операции документа \\"Нормативы распределения планов продаж по категориям\\")","answer_number":2,"answer_text":"рассчитывается, исходя из коэффициента, указанного в документе \\"Нормативы распределения планов продаж по категориям\\", и скорости продаж","confirmed":true},{"id":"2.14","section_number":2,"section":"Планирование","question_number":14,"question":"Документ \\"Нормативы распределения планов продаж по категориям\\" может хранить параметры распределения по значениям, указываемым:","options":"1) в определенном реквизите справочника номенклатуры (состав реквизитов, по которым возможно распределение, заложен в реализации механизма)\\n2) в дополнительном реквизите справочника \\"Номенклатура\\"\\n3) в дополнительном реквизите \\"Характеристики номенклатуры\\"\\n4) вариант 1 или 2\\n5) вариант 2 или 3\\n6) верны все варианты","answer_number":6,"answer_text":"верны все варианты","confirmed":true},{"id":"2.15","section_number":2,"section":"Планирование","question_number":15,"question":"Планирование по скорости продаж возможно для следующих видов планов:","options":"1) планы продаж\\n2) планы продаж по категориям\\n3) планы закупок\\n4) варианты 1 и 2\\n5) верны все варианты","answer_number":2,"answer_text":"планы продаж по категориям","confirmed":true},{"id":"2.16","section_number":2,"section":"Планирование","question_number":16,"question":"Принятый в работу конечный план (подсистемы товарного планирования) должен быть оформлен:","options":"1) в рамках одного (результирующего) документа\\n2) в рамках одного или разных документов, объединенных сценарием и периодом\\n3) в рамках одного или разных документов, объединенных видом плана и периодом\\n4) в рамках одного или разных документов, объединенных сценарием, видом плана и периодом\\n5) вариант 2 или 3 (в зависимости от настройки вида плана)\\n6) вариант 2 или 4 (в зависимости от настройки вида плана)","answer_number":2,"answer_text":"в рамках одного или разных документов, объединенных сценарием и периодом","confirmed":true},{"id":"2.17","section_number":2,"section":"Планирование","question_number":17,"question":"Периодичность ввода плановых значений (в подсистеме товарного планирования) устанавливается:","options":"1) в документе планирования\\n2) в сценарии товарного планирования\\n3) в виде плана","answer_number":2,"answer_text":"в сценарии товарного планирования","confirmed":true},{"id":"2.18","section_number":2,"section":"Планирование","question_number":18,"question":"Период планирования, по которому вводятся плановые данные в документ товарного планирования (например, закупки или продажи):","options":"1) может включать в себя только один период, соответствующий периодичности планирования (например, при периодичности \\"месяц\\" плановые данные вводятся только за один месяц)\\n2) может быть больше периодичности планирования (например, при периодичности \\"месяц\\" плановые данные могут вводиться за несколько месяцев)\\n3) может быть меньше периодичности планирования (например, при периодичности \\"месяц\\" плановые данные могут вводиться на неделю)\\n4) варианты 2 и 3\\n5) вариант 2 или 3 (определяется настройкой документа)","answer_number":2,"answer_text":"может быть больше периодичности планирования (например, при периодичности \\"месяц\\" плановые данные могут вводиться за несколько месяцев)","confirmed":true},{"id":"2.19","section_number":2,"section":"Планирование","question_number":19,"question":"Правило получения данных, используемое по умолчанию при генерации нового плана (в подсистеме планирования запасов), указывается:","options":"1) в документе планирования (по умолчанию не определяется)\\n2) в сценарии планирования\\n3) в виде плана","answer_number":3,"answer_text":"в виде плана","confirmed":true},{"id":"2.20","section_number":2,"section":"Планирование","question_number":20,"question":"Запрет на изменение параметров правила заполнения данных планирования запасов указывается:","options":"1) в документе планирования\\n2) в сценарии планирования\\n3) в виде плана\\n4) в правах пользователя","answer_number":3,"answer_text":"в виде плана","confirmed":true},{"id":"2.21","section_number":2,"section":"Планирование","question_number":21,"question":"Укрупненное планирование продаж (планы продаж по категориям) осуществляется по:","options":"1) номенклатурным группам\\n2) товарным категориям\\n3) ассортиментным группам\\n4) по группам справочника \\"Номенклатура\\"\\n5) варианты 1 и/или 3","answer_number":2,"answer_text":"товарным категориям","confirmed":true},{"id":"2.22","section_number":2,"section":"Планирование","question_number":22,"question":"Укрупненное планирование продаж (планы продаж по категориям) можно вести с указанием в качестве аналитики:","options":"1) \\"Склад\\"\\n2) \\"Партнер\\"\\n3) \\"Подразделение\\"\\n4) \\"Соглашения\\"\\n5) верны варианты 1 и/или 3\\n6) верны все варианты","answer_number":5,"answer_text":"верны варианты 1 и/или 3","confirmed":true},{"id":"2.23","section_number":2,"section":"Планирование","question_number":23,"question":"Укрупненное планирование продаж (планы продаж по категориям) можно вести:","options":"1) только по количеству\\n2) только по суммам\\n3) указывается в сценарии (или по количеству или по сумме)\\n4) указывается в сценарии (по количеству, количеству и сумме)","answer_number":1,"answer_text":"только по количеству","confirmed":true},{"id":"2.24","section_number":2,"section":"Планирование","question_number":24,"question":"При выборе в качестве дополнительной аналитики склада (в подсистеме товарного планирования):","options":"1) на каждый склад определяется отдельный документ планирования, склад указывается в шапке документа\\n2) можно оформить один документ планирования, склад указывается в строке табличной части\\n3) вариант 1 или 2 (в зависимости от настройки вида плана)\\n4) вариант 1 или 2 (в зависимости от настройки сценария)","answer_number":3,"answer_text":"вариант 1 или 2 (в зависимости от настройки вида плана)","confirmed":true},{"id":"2.25","section_number":2,"section":"Планирование","question_number":25,"question":"При определении правила заполнения данных для планов, источник данных планирования:","options":"1) может быть только один\\n2) может быть указано только два источника (источник данных для количества и суммы)\\n3) может использоваться любое количество источников","answer_number":3,"answer_text":"может использоваться любое количество источников","confirmed":true},{"id":"2.26","section_number":2,"section":"Планирование","question_number":26,"question":"При заполнении данных плана вручную на период, содержащий несколько подпериодов, идентичных периодичности планирования (например, при вводе данных за квартал с периодичностью \\"Месяц\\"):","options":"1) данные за разные подпериоды планирования вводятся разными строками табличной части\\n2) данные за разные подпериоды планирования вводятся в разные колонки строки табличной части\\n3) вариант 1 или 2 (в зависимости от настройки документа)\\n4) вариант 1 или 2 (в зависимости от настройки вида плана)\\n5) вариант 1 или 2 (в зависимости от настройки сценария)","answer_number":3,"answer_text":"вариант 1 или 2 (в зависимости от настройки документа)","confirmed":true},{"id":"2.27","section_number":2,"section":"Планирование","question_number":27,"question":"При заполнении данных плана с использованием источников планирования на период, содержащий нес ,"section":"Нормирование","question_number":20,"question":"При настройке ресурсной спецификации характеристика потребляемого материала может:","options":"1) задаваться в табличной части \\"Материалы и работы\\"\\n2) определяться характеристикой выпускаемой продукции\\n3) уточняться при производстве\\n4) вариант 1 или 2\\n5) вариант 1 или 3\\n6) верны все варианты","answer_number":6,"answer_text":"верны все варианты","confirmed":true},{"id":"10.21","section_number":10,"section":"Нормирование","question_number":21,"question":"Расценки на работы сотрудников (указываемых на закладке \\"Трудозатраты\\" ресурсной спецификации) указываются в валюте:","options":"1) управленческого учета\\n2) регламентированного учета\\n3) в произвольной валюте\\n4) валюте, установленной в настройках системы (\\"Валюта видов работ сотрудников\\")","answer_number":4,"answer_text":"валюте, установленной в настройках системы (\\"Валюта видов работ сотрудников\\")","confirmed":true},{"id":"10.22","section_number":10,"section":"Нормирование","question_number":22,"question":"Установка длительности предварительного и завершающего буферов этапов ресурсной спецификации (в случае построения графика производства с периодичностью \\"Час\\") может производиться в:","options":"1) минутах\\n2) часах\\n3) днях\\n4) вариант 1 или 2\\n5) вариант 2 или 3\\n6) вариант 1 или 2 или 3","answer_number":3,"answer_text":"днях","confirmed":true},{"id":"10.23","section_number":10,"section":"Нормирование","question_number":23,"question":"Установка длительности предварительного и завершающего буферов этапов ресурсной спецификации (в случае построения графика производства с периодичностью \\"День\\") может производиться в:","options":"1) минутах\\n2) часах\\n3) днях\\n4) вариант 1 или 2\\n5) вариант 2 или 3\\n6) варианты 1 или 2 или 3","answer_number":3,"answer_text":"днях","confirmed":true},{"id":"10.24","section_number":10,"section":"Нормирование","question_number":24,"question":"Если для этапа ресурсной спецификации ис ью\\n2) работающие параллельно\\n3) выполняющие одинаковые производственные операции\\n4) варианты 1 и 3\\n5) варианты 2 и 3","answer_number":3,"answer_text":"выполняющие одинаковые производственные операции","confirmed":true},{"id":"11.15","section_number":11,"section":"Управление производством","question_number":15,"question":"При использовании пооперационного уровня управления возможны варианты его использования:","options":"1) с указанием в операциях материалов\\n2) с указанием в операциях выходных изделий\\n3) с использованием пооперационного планирования\\n4) либо варианты 1 и 2, либо вариант 3\\n5) любая комбинация вариантов 1, 2, 3","answer_number":5,"answer_text":"любая комбинация вариантов 1, 2, 3","confirmed":true},{"id":"11.16","section_number":11,"section":"Управление производством","question_number":16,"question":"В заказ на производство, формируемый по потребностям, попадают потребности:","options":"1) возникшие по номенклатуре, у которой в параметрах обеспечения потребностей на определенном складе выбрано значение \\"Производство\\"\\n2) возникшие по номенклатуре, у которой в параметрах обеспечения потребностей в определенной цеховой кладовой выбрано значение \\"Производство\\"\\n3) возникшие по полуфабрикату, необходимому для производства продукции, когда в этапе производства для него указано \\"Производится по спецификации или на этапе\\" (с указанием ресурсной спецификации)\\n4) варианты 1 и 2\\n5) варианты 1 и 3\\n6) верны все варианты","answer_number":4,"answer_text":"варианты 1 и 2","confirmed":true},{"id":"11.17","section_number":11,"section":"Управление производством","question_number":17,"question":"Реквизит \\"Приоритет\\" заказа на производство может принимать:","options":"1) 3 значения\\n2) 5 значений\\n3) 10 значений\\n4) 100 значений\\n5) любое количество значений","answer_number":5,"answer_text":"любое количество значений","confirmed":true},{"id":"11.18","section_number":11,"section":"Управление производством","question_number":18,"que риал заменить на его аналог, то нужно:","options":"1) создать новую ресурсную спецификацию и указать ее в заказе на производство\\n2) в этапе производства на закладке \\"Обеспечение материалами и работами\\" удалить строку со старым материалом и добавить новую строку с новым материалом\\n3) в этапе производства на закладке \\"Обеспечение материалами и работами\\" выбрать аналог из ранее разрешенных к использованию материалов\\n4) в этапе производства на закладке \\"Обеспечение материалами и работами\\" выбрать новый материал (никаких дополнительных действий выполнять не нужно)\\n5) вариант 2 или 4","answer_number":3,"answer_text":"в этапе производства на закладке \\"Обеспечение материалами и работами\\" выбрать аналог из ранее разрешенных к использованию материалов","confirmed":true},{"id":"11.21","section_number":11,"section":"Управление производством","question_number":21,"question":"При заполнении документа \\"Заказ на производство\\" в шапке документа указывается подразделение:","options":"1) в котором будет производиться выпуск продукции\\n2) сформировавшее потребность в производстве\\n3) подразделение-диспетчер\\n4) варианты 1 и 2\\n5) варианты 1 и 3\\n6) варианты 1 и 2 и 3","answer_number":3,"answer_text":"подразделение-диспетчер","confirmed":true},{"id":"11.22","section_number":11,"section":"Управление производством","question_number":22,"question":"Приоритет подразделения-диспетчера в очереди заказов может быть изменен в:","options":"1) форме элемента справочника подразделения-диспетчера\\n2) форме списка \\"Настройка приоритетов подразделений-диспетчеров\\"\\n3) в периодическом регистре сведений \\"Приоритеты подразделений-диспетчеров\\"\\n4) вариант 1 или 3","answer_number":2,"answer_text":"форме списка \\"Настройка приоритетов подразделений-диспетчеров\\"","confirmed":true},{"id":"11.23","section_number":11,"section":"Управление производством","question_number":23,"question":"В заказе на производство (динамическая структура заказа) порядок размещения выпуска в графике производства может быть:","options":"1) к началу\\n2) к окончанию\\n3) равномерно\\n4) вариант 1 или 2\\n5) вариант 1 или 2 или 3","answer_number":1,"answer_text":"к началу","confirmed":true},{"id":"11.24","section_number":11,"section":"Управление производством","question_number":24,"question":"Для того чтобы в строке формируемого этапа производства (на закладке \\"Обеспечение материалами и работами\\") в качестве стратегии получения материала использовалось значение \\"Обеспечивать\\" (значение по умолчанию), необходимо:","options":"1) установить для материала в способе обеспечения потребностей (в параметрах управления запасами) тип обеспечения \\"Покупка\\"\\n2) выполнить соответствующую настройку в строке ресурсной спецификации (на закладке \\"Материалы и работы\\")\\n3) настроить для материала метод обеспечения (параметры поддержания запаса)\\n4) варианты 1 и 2\\n5) варианты 1 и 2 и 3","answer_number":2,"answer_text":"выполнить соответствующую настройку в строке ресурсной спецификации (на закладке \\"Материалы и работы\\")","confirmed":true},{"id":"11.25","section_number":11,"section":"Управление производством","question_number":25,"question":"Для того чтобы в строке этапа производства (на закладке \\"Обеспечение материалами и работами\\") в качестве стратегии получения материала использовалось значение \\"Не обеспечивать\\":","options":"1) для материала должен отсутствовать способ обеспечения потребностей\\n2) соответствующая настройка должна быть выполнена в строке ресурсной спецификации (на закладке \\"Материалы и работы\\")\\n3) для материала должен отсутствовать метод обеспечения (параметры поддержания запаса)\\n4) варианты 1 и 2\\n5) варианты 1 и 2 и 3\\n6) нет такой возможности","answer_number":6,"answer_text":"нет такой возможности","confirmed":true},{"id":"11.26","section_number":11,"section":"Управление производством","question_number":26,"question":"При использовании динамической структуры заказа потребности в материалах возникают:","options":"1) при проведении заказа на производство\\n2) при формировании партий производства\\n3) при формировании графика производства\\n4) при установке у этапа производства статуса \\"К выполнению\\"\\n5) при установке у этапа производства статуса \\"Начат\\"","answer_number":1,"answer_text":"при проведении заказа на производство","confirmed":true},{"id":"11.27","section_number":11,"section":"Управление производством","question_number":27,"question":"Если в строке этапа производства (закладка \\"Обеспечение материалами и работами\\") не указано, что полуфабрикат производится в процессе производства, то для того, чтобы этап прошел контроль по материальному обеспечению:","options":"1) данный полуфабрикат должен находиться на складе\\n2) данный полуфабрикат должен находиться в производственном подразделении\\n3) данный полуфабрикат должен находиться в цеховой кладовой\\n4) вариант 1 или 3 (зависит от значения реквизита табличной части \\"Склад\\")\\n5) вариант 1 или 2 или 3 (зависит от значения реквизита табличной части \\"Склад\\")\\n6) вариант 1 или 2 или 3 (зависит от значений реквизита табличной части \\"Действия\\" и \\"Склад\\")","answer_number":4,"answer_text":"вариант 1 или 3 (зависит от значения реквизита табличной части \\"Склад\\")","confirmed":true},{"id":"11.28","section_number":11,"section":"Управление производством","question_number":28,"question":"При формировании заказа на производство для полуфабрикатов, которые требуются для обеспечения выпусков продукции, система может предложить к производству:","options":"1) количество, рассчитанное по ранее оформленным (и не обеспеченным по данным полуфабрикатам) заказам на производство (без учета запасов и других потребностей)\\n2) количество, рассчитанное по ранее оформленным (и не обеспеченным по данным полуфабрикатам) заказам на производство, с учетом существующего остатка полуфабрикатов на складе\\n3) количество, рассчитанное по ранее оформленным (и не обеспеченным по данным полуфабрикатам) заказам на производство, с учетом уже запланированных выпусков данных полуфабрикатов\\n4) вариант 1 или 2\\n5) вариант 2 или 3\\n6) вариант 1 или 2 или 3","answer_number":5,"answer_text":"вариант 2 или 3","confirmed":true},{"id":"11.29","section_number":11,"section":"Управление производством","question_number":29,"question":"В случае если при построении графика производства на нужный интервал планирования не хватает доступности загружаемых видов рабочих центров, то из данной ситуации можно выйти следующим образом:","options":"1) при построении графика производства отметить флажок \\"С учетом альтернативных видов рабочих центров\\" (альтернативные виды рабочих центров должны быть указаны в ресурсной спецификации)\\n2) при построении графика производства отметить флажок \\"С учетом альтернативных видов рабочих центров\\" (альтернативный вид рабочего центра может быть выбран вручную)\\n3) в этапе производства выбрать альтернативные виды рабочих центров (только из перечня, указанного в этапе ресурсной спецификации)\\n4) в этапе производства выбрать альтернативные виды рабочих центров (можно выбрать произвольный вид рабочего центра)\\n5) вариант 1 или 3\\n6) вариант 2 или 4","answer_number":4,"answer_text":"в этапе производства выбрать альтернативные виды рабочих центров (можно выбрать произвольный вид рабочего центра)","confirmed":true},{"id":"11.30","section_number":11,"section":"Управление производством","question_number":30,"question":"В рабочем месте \\"Диспетчирование этапов\\" можно:","options":"1) планировать заказ\\n2) планировать выбранные этапы/партии производства\\n3) планировать работы по устранению брака\\n4) варианты 1 и 2\\n5) варианты 1 и 2 и 3","answer_number":4,"answer_text":"варианты 1 и 2","confirmed":true},{"id":"11.31","section_number":11,"section":"Управление производством","question_number":31,"question":"Порядок следования заказов на производство в очереди заказов определяется:","options":"1) приоритетом заказа / временем создания заказа\\n2) приоритетом подразделения-диспетчера / временем создания заказа\\n3) приоритетом заказа / ручной установкой положения внутри приоритета\\n4) приоритетом подразделения-диспетчера / ручной установкой положения внутри приоритета подразделения-диспетчера\\n5) приоритетом заказа / приоритетом подразделения-диспетчера / ручной установкой положения внутри группы\\n6) приоритетом заказа / приоритетом подразделения-диспетчера / временем создания заказа","answer_number":5,"answer_text":"приоритетом заказа / приоритетом подразделения-диспетчера / ручной установкой положения внутри группы","confirmed":true},{"id":"11.32","section_number":11,"section":"Управление производством","question_number":32,"question":"Изменить порядок следования заказов в очереди заказов на производство можно в рамках:","options":"1) без ограничений\\n2) заказов с одинаковым приоритетом\\n3) заказов, обрабатываемых определенным подразделением-диспетчером\\n4) заказов с одинаковым приоритетом и обрабатываемых определенным подразделением-диспетчером","answer_number":4,"answer_text":"заказов с одинаковым приоритетом и обрабатываемых определенным подразделением-диспетчером","confirmed":true},{"id":"11.33","section_number":11,"section":"Управление производством","question_number":33,"question":"Имитационное моделирование графика производства возможно:","options":"1) без контроля доступности материалов\\n2) без контроля доступности производственных мощностей\\n3) без учета резерва доступности видов рабочих центров\\n4) варианты 1 и/или 2\\n5) варианты 1 и/или 2 и/или 3","answer_number":5,"answer_text":"варианты 1 и/или 2 и/или 3","confirmed":true},{"id":"11.34","section_number":11,"section":"Управление производством","question_number":34,"question":"Если при построении графика производства (по этапам производства, требующим оценки загрузки видов рабочих центров) по загружаемым рабочим центрам не заполнена доступность, то сформировать график производства можно, установив в параметрах расчета флажок:","options":"1) \\"Игнорирова
